project:
  title: "AI & LLM Ethics Living Literature Tracker"
  output_xlsx: "AI_LLM_Ethics_Living_Tracker.xlsx"
  lookback_days: 10
  new_this_week_days: 7
  minimum_review_score: 70
  auto_promote_official_score: 95
  auto_promote_official: true
  max_results_per_query: 30
  max_policy_links_per_page: 25
  emit_on_first_policy_scan: false

runtime:
  request_timeout_seconds: 30
  arxiv_delay_seconds: 3
  user_agent: "AI-Ethics-Living-Tracker/1.0"

queries:
  - name: "LLM ethics and responsible AI"
    general: "large language model ethics responsible AI generative AI risks"
    arxiv: 'all:"large language model" AND (all:ethics OR all:"responsible AI" OR all:risk)'
  - name: "Bias fairness and discrimination"
    general: "large language models bias fairness discrimination stereotypes"
    arxiv: '(all:LLM OR all:"large language model") AND (all:bias OR all:fairness OR all:discrimination)'
  - name: "Privacy memory and personal data"
    general: "LLM agent privacy memory leakage personal data"
    arxiv: '(all:LLM OR all:"large language model") AND (all:privacy OR all:memory OR all:leakage)'
  - name: "Persuasion manipulation and autonomy"
    general: "LLM persuasion manipulation influence autonomy"
    arxiv: '(all:LLM OR all:"large language model") AND (all:persuasion OR all:manipulation OR all:autonomy)'
  - name: "Human AI relationships"
    general: "AI companion emotional dependence anthropomorphism sycophancy LLM"
    arxiv: '(all:LLM OR all:"artificial intelligence") AND (all:companion OR all:"emotional dependence" OR all:anthropomorphism OR all:sycophancy)'
  - name: "Agentic AI governance and safety"
    general: "agentic AI autonomous agents governance safety accountability privacy"
    arxiv: '(all:"agentic AI" OR all:"LLM agent" OR all:"autonomous agent") AND (all:governance OR all:safety OR all:accountability OR all:privacy)'
  - name: "Transparency accountability and regulation"
    general: "AI transparency accountability regulation governance standards generative AI"
    arxiv: '(all:AI OR all:"large language model") AND (all:transparency OR all:accountability OR all:regulation OR all:governance)'
  - name: "AI sustainability labor and inequality"
    general: "AI environmental impact energy water labor automation inequality ethics"
    arxiv: 'all:AI AND (all:energy OR all:water OR all:labor OR all:automation OR all:inequality)'

