name: Update AI Ethics Living Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: write

concurrency:
  group: ai-ethics-living-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update tracker
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python update_tracker.py

      - name: Export live Google Sheets feeds
        run: python export_live_csv.py

      - name: Commit refreshed data, feeds and workbook
        run: |
          git config user.name "ai-ethics-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          git add AI_LLM_Ethics_Living_Tracker.xlsx data/ live/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update AI ethics living tracker"
            git push
          fi
